[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenisation-fr"
version = "0.1.0"
description = "Boîte à outils de tokenisation pour le texte français (NLTK, SpaCy, n-grammes)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Uthaï" }
]
keywords = ["nlp", "tokenisation", "francais", "nltk", "spacy", "ngrams"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: French",
    "Topic :: Text Processing :: Linguistic",
]

# Dépendances minimales pour faire fonctionner le package.
dependencies = [
    "nltk>=3.6",
]

# Dépendances optionnelles : installables via `pip install tokenisation-fr[spacy]`
[project.optional-dependencies]
spacy = ["spacy>=3.0"]

[project.urls]
Homepage = "https://github.com/<ton-utilisateur>/tokenisation-fr"
Repository = "https://github.com/<ton-utilisateur>/tokenisation-fr"

[tool.setuptools.packages.find]
# On ne package que le dossier de code, pas les exemples ni les tests.
include = ["tokenisation_fr*"]
